name: Authenticated API Tests
description: Example showing authentication with bearer tokens and headers

# Base request with authentication
curl: |
  curl 'https://reqres.in/api/users' \
    -H 'Content-Type: application/json' \
    -H 'Accept: application/json' \
    -H 'Authorization: Bearer dummy-token-for-example'

# Setup phase - typically you'd login first
setup:
  extract_variables:
    - name: api_base_url
      source: response

test_cases:
  - name: Create user with authentication
    description: Create a new user with auth headers
    modify_request:
      method: POST
      body:
        name: "Authenticated User"
        job: "Software Engineer"
    assertions:
      - type: status_code
        expected: 201
      - type: json_path
        path: $.name
        expected: "Authenticated User"
      - type: json_path
        path: $.id
        exists: true
      - type: header
        header_name: Content-Type
        contains: application/json
      - type: response_time
        max_ms: 3000
    extract_variables:
      - name: created_user_id
        source: json_path
        path: $.id

  - name: Update user with custom headers
    description: Update user with additional headers
    modify_request:
      method: PUT
      headers:
        X-Request-ID: "test-request-123"
        Authorization: "Bearer ${auth_token}"
      body:
        name: "Updated User"
        job: "Senior Engineer"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: $.updatedAt
        exists: true

  - name: Get user list with pagination
    description: Fetch users with query parameters
    modify_request:
      method: GET
      body: null
      queryParams:
        page: "2"
        per_page: "6"
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: $.page
        expected: 2
      - type: json_path
        path: $.per_page
        expected: 6
      - type: json_path
        path: $.data[0]
        exists: true

  - name: Test with invalid token
    description: Should handle authentication failures gracefully
    modify_request:
      headers:
        Authorization: "Bearer invalid-token"
    assertions:
      - type: status_code
        expected: 200  # reqres.in doesn't actually validate tokens
      - type: response_time
        max_ms: 2000