name: Login Test
description: Test login with valid credentials
metadata:
  service: psp
tests:
  - name: Valid Login
    type: ui
    steps:
      - description: Enter username and password
        action: fill
      - description: Click login button
        action: click
    assertions:
      - type: ui_visible
        selector: '[data-testid=''login-success-message'']'
      - type: ui_text
        selector: '[data-testid=''login-success-message'']'
        expected: Login successful
config:
  service: psp
