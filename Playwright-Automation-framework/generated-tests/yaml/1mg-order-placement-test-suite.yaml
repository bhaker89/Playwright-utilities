name: 1MG Order Placement Test Suite
description: Validate order placement flow on 1MG website
baseUrl: https://www.1mg.com
tests:
  - name: Valid Login and Order Placement
    description: Validate login and order placement flow with valid credentials
    category: positive
    type: ui
    steps:
      - action: navigate
        page: LoginPage
      - action: fill
        element: Mobile Number Field
        value: '9599612806'
      - action: click
        element: Login Button
      - action: waitForOtp
        otp: '{{otp}}'
      - action: fill
        element: OTP Field
        value: '{{otp}}'
      - action: click
        element: Verify OTP Button
      - action: navigate
        page: HomePage
      - action: fill
        element: Search Text Box
        value: telma 40 tablet
      - action: click
        element: Search Button
      - action: navigate
        page: SearchResultPage
      - action: click
        element: Telma 40 Tablet Product
      - action: navigate
        page: CartPage
      - action: fill
        element: Quantity Field
        value: '2'
      - action: click
        element: Proceed to Cart Button
      - action: click
        element: Apply Coupon Button
      - action: applyAnyApplicableCoupon
      - action: fill
        element: Address Field
        value: tata 1mg sector 14, gurgaon
      - action: click
        element: Continue Button
      - action: selectShipment
      - action: selectPaymentMode
        mode: COD
      - action: click
        element: Place Order Button
    assertions:
      - type: text
        element: Sku Name Text
        expected: Telma 40 Tablet
      - type: text
        element: Quantity Text
        expected: '2'
      - type: text
        element: Payment Details Text
        expected: Cash on Delivery
  - name: Invalid OTP
    description: Validate login flow with invalid OTP
    category: negative
    type: ui
    steps:
      - action: navigate
        page: LoginPage
      - action: fill
        element: Mobile Number Field
        value: '9599612806'
      - action: click
        element: Login Button
      - action: waitForOtp
        otp: '{{otp}}'
      - action: fill
        element: OTP Field
        value: invalid-otp
      - action: click
        element: Verify OTP Button
    assertions:
      - type: visible
        element: Error Message
      - type: text
        element: Error Message
        expected: Invalid OTP
