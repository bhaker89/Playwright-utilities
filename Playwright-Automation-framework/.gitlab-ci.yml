  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - allure-results/
    expire_in: 30 days
  only:
    - merge_requests
    - main

# Generate Allure Report
report:allure:
  stage: report
  image: node:${NODE_VERSION}
  dependencies:
    - test:api
    - test:ui:chromium
    - test:integrated
  script:
    - npm install -g allure-commandline
    - allure generate allure-results --clean -o allure-report
  artifacts:
    paths:
      - allure-report/
    expire_in: 30 days
  only:
    - main
    - develop

# Deploy Reports to GitLab Pages
pages:
  stage: deploy
  dependencies:
    - report:allure
  script:
    - mkdir -p public
    - cp -r allure-report/* public/
    - cp -r playwright-report public/playwright
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - main

# Scheduled Regression Tests
scheduled:regression:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  dependencies:
    - install:dependencies
  script:
    - export TEST_ENV=prod
    - npm run test -- --grep @regression
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 30 days
  only:
    - schedules