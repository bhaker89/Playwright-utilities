# GitLab CI/CD Pipeline for Playwright Automation Framework

stages:
  - install
  - lint
  - test
  - report
  - deploy

variables:
  NODE_VERSION: "18"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# Cache configuration for faster builds
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm
    - .cache/ms-playwright
    - node_modules

# Install dependencies
install:dependencies:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npx playwright install --with-deps
  artifacts:
    paths:
      - node_modules/
      - .cache/ms-playwright/
    expire_in: 1 day
  only:
    - merge_requests
    - main
    - develop

# Code quality checks
lint:code:
  stage: lint
  image: node:${NODE_VERSION}
  dependencies:
    - install:dependencies
  script:
    - npm run lint
    - npm run format:check
    - npm run type-check
  only:
    - merge_requests
    - main

# API Tests
test:api:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  dependencies:
    - install:dependencies
  script:
    - export TEST_ENV=staging
    - npm run test:api -- --reporter=html --reporter=json --reporter=junit
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - allure-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 30 days
  parallel:
    matrix:
      - TEST_ENV: [dev, staging]
  only:
    - merge_requests
    - main
    - develop

