# Service Configuration
# Define all your services, auth tokens, and base URLs here
# Environment-specific values can be overridden using .env files

services:
  # Nexus Repository Service
  nexus:
    name: "Nexus Repository Manager"
    base_url: "${ORDER_NEXUS_BASE_URL}"
    endpoints:
      health: "/service/rest/v1/status"
      repositories: "/service/rest/v1/repositories"
      components: "/service/rest/v1/components"
      search: "/service/rest/v1/search"
    auth:
      type: "bearer"  # bearer | basic | api_key | custom
      token: "${NEXUS_AUTH_TOKEN}"
      # For basic auth (will be auto-converted to base64)
      # username: "${NEXUS_USERNAME}"
      # password: "${NEXUS_PASSWORD}"
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    timeout: 30000
    retry:
      enabled: true
      max_attempts: 3
      delay: 1000

  # Example: User Service
  user-service:
    name: "User Management Service"
    base_url: "${USER_SERVICE_BASE_URL}"
    endpoints:
      login: "/api/v1/auth/login"
      users: "/api/v1/users"
      profile: "/api/v1/users/profile"
    auth:
      type: "bearer"
      token: "${USER_SERVICE_TOKEN}"
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    timeout: 15000

  # Example: Order Service
  order-service:
    name: "Order Processing Service"
    base_url: "${ORDER_SERVICE_BASE_URL}"
    endpoints:
      orders: "/api/v1/orders"
      create: "/api/v1/orders/create"
      status: "/api/v1/orders/{orderId}/status"
    auth:
      type: "api_key"
      header_name: "X-API-Key"
      api_key: "${ORDER_SERVICE_API_KEY}"
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    timeout: 20000

  # Example: Payment Gateway
  payment-gateway:
    name: "Payment Gateway API"
    base_url: "${PAYMENT_GATEWAY_URL}"
    endpoints:
      charge: "/v2/payments/charge"
      refund: "/v2/payments/refund"
      status: "/v2/payments/status"
    auth:
      type: "basic"
      username: "${PAYMENT_USERNAME}"
      password: "${PAYMENT_PASSWORD}"
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    timeout: 45000

  # Example: External API (no auth)
  public-api:
    name: "Public Data API"
    base_url: "https://api.publicapis.org"
    endpoints:
      entries: "/entries"
      categories: "/categories"
    auth:
      type: "none"
    headers:
      Accept: "application/json"
    timeout: 10000

# Environment Mappings
# Map service names to environment-specific configurations
environments:
  stag:
    nexus:
      base_url: "https://staginternalapi.1mg.com"
    user-service:
      base_url: "https://stag-users.1mg.com"
    order-service:
      base_url: "https://stag-orders.1mg.com"

  prod:
    nexus:
      base_url: "https://internalapi.1mg.com"
    user-service:
      base_url: "https://users.1mg.com"
    order-service:
      base_url: "https://orders.1mg.com"

  dev:
    nexus:
      base_url: "http://localhost:8081"
    user-service:
      base_url: "http://localhost:3001"
    order-service:
      base_url: "http://localhost:3002"

# Default Configuration
defaults:
  timeout: 30000
  retry:
    enabled: false
    max_attempts: 1
  headers:
    Accept: "application/json"